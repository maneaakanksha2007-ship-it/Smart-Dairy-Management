{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>Milk Collection</h1>
  <p>Enter the approved farmer's RFID, milk quantity, quality values, and the approved rate per litre. Total amount is calculated automatically as quantity × rate.</p>
  <form method="post" action="{{ url_for('milk_collection') }}">
    <label for="rfid">Farmer RFID</label>
    <input id="rfid" name="rfid" type="text" required maxlength="50">

    <label for="collection_date">Collection Date</label>
    <input id="collection_date" name="collection_date" type="date" value="{{ today }}" required>

    <label for="collection_time">Collection Time</label>
    <input id="collection_time" name="collection_time" type="time" value="{{ current_time }}" required>

    <label for="quantity">Quantity (litres)</label>
    <input id="quantity" name="quantity" type="number" min="0.01" step="0.01" required>

    <label for="fat">FAT (%)</label>
    <input id="fat" name="fat" type="number" min="0" max="100" step="0.01" required>

    <label for="snf">SNF (%)</label>
    <input id="snf" name="snf" type="number" min="0" max="100" step="0.01" required>

    <label for="rate">Approved Rate per Litre (₹)</label>
    <input id="rate" name="rate" type="number" min="0" step="0.01" required>

    <p>Estimated total: ₹<strong id="total-preview">0.00</strong></p>
    <button type="submit">Save Milk Collection</button>
  </form>
</div>
<script>
(function () {
  const quantity = document.getElementById("quantity");
  const rate = document.getElementById("rate");
  const output = document.getElementById("total-preview");
  function updateTotal() {
    const q = Number(quantity.value || 0);
    const r = Number(rate.value || 0);
    output.textContent = (q * r).toFixed(2);
  }
  quantity.addEventListener("input", updateTotal);
  rate.addEventListener("input", updateTotal);
})();
</script>
{% endblock %}
